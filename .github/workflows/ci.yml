name: CI

# Vérifie chaque envoi sur dev et chaque PR : formatage, style, tests, export Windows de contrôle.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  # Garder ce nom : les règles de protection de main et dev exigent le statut « check ».
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Formatage
        run: gdformat --check autoload game net sim ui view tests tools

      - name: Style
        run: gdlint autoload game net sim ui view tests tools

      - name: Installer Godot
        id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Tests
        run: |
          "${{ steps.godot.outputs.godot }}" --headless -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json

      - name: Export Windows de contrôle
        run: |
          mkdir -p build/windows
          "${{ steps.godot.outputs.godot }}" --headless --export-release "Windows Desktop" build/windows/Mycelium.exe
          test -s build/windows/Mycelium.exe
