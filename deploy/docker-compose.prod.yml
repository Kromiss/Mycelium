# Production-only additions: public ports 80/443, TLS certificates, staging routes.
services:
  web:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./sites:/etc/caddy/sites:ro

volumes:
  caddy-data:
  caddy-config:
