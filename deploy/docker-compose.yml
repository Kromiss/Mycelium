# Base stack, shared by production and staging slots.
# Run through deploy.sh / deploy-staging.sh, which set the compose project name and env file.
# Required variables: IMAGE_PREFIX, IMAGE_TAG, POSTGRES_PASSWORD, SITE_ADDRESS, EDGE_ALIAS.

services:
  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      server:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: ["${EDGE_ALIAS}"]

  server:
    image: ${IMAGE_PREFIX}/server:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://mycelium:${POSTGRES_PASSWORD}@postgres:5432/mycelium
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mycelium
      POSTGRES_DB: mycelium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

networks:
  # Shared between prod and staging so the prod Caddy can route staging sub-domains.
  edge:
    name: mycelium-edge
    external: true
