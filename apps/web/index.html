<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e0a" />
    <title>Mycelium</title>
  </head>
  <body>
    <div id="map" class="map"></div>

    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="res">
        <span class="res-label" data-i18n="res.nutrients"></span>
        <span class="res-value" id="nutrients">0</span>
        <span class="res-rate" id="nutrients-rate"></span>
      </div>
      <div class="res res-biomass">
        <span class="res-label" data-i18n="res.biomass"></span>
        <span class="res-value" id="biomass">0</span>
        <span class="res-rate" id="biomass-rate"></span>
      </div>
      <div class="res res-enzymes" id="enzymes-res" hidden>
        <span class="res-label" data-i18n="res.enzymes"></span>
        <span class="res-value" id="enzymes">0</span>
        <span class="res-rate" id="enzymes-rate"></span>
      </div>
      <div class="res res-tiles">
        <span class="res-label" data-i18n="res.tiles"></span>
        <span class="res-value" id="tiles">1</span>
      </div>
      <div class="res res-trophies">
        <span class="res-label" data-i18n="res.trophies"></span>
        <span class="res-value" id="trophies">0</span>
      </div>
      <div class="res res-queue">
        <span class="res-label" data-i18n="res.queue"></span>
        <span class="res-value" id="queue">0/10</span>
      </div>
      <div class="phase" id="phase">
        <span class="phase-name" id="phase-name"></span>
        <span class="phase-desc" id="phase-desc"></span>
        <span class="phase-clock" id="phase-clock"></span>
      </div>
      <div class="topbar-end">
        <span class="forest-label" id="forest-label"></span>
        <span class="player" id="player-name"></span>
        <button type="button" class="ghost" id="logout-btn" data-i18n="account.logout"></button>
        <button type="button" class="ghost" id="lang-btn" data-i18n="lang.switch" data-i18n-aria="lang.switchLabel"></button>
      </div>
    </header>

    <button type="button" class="panel mini-board" id="mini-board" data-i18n-aria="board.open">
      <span class="mini-board-title"><span data-i18n="board.title"></span> <span id="mini-board-rank"></span></span>
      <ol id="mini-board-rows"></ol>
    </button>

    <aside class="panel upgrades" id="upgrades">
      <div class="tabs panel-tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-upgrades" aria-selected="true" data-i18n="upgrades.title"></button>
        <button type="button" role="tab" class="tab" id="tab-mutations" aria-selected="false"></button>
      </div>
      <div id="upgrades-view">
        <ul id="upgrade-list"></ul>
      </div>
      <div id="mutations-view" hidden>
        <p class="strain-line" id="strain-line"></p>
        <p class="mutation-points" id="mutation-points"></p>
        <div id="mutation-branches"></div>
      </div>
    </aside>

    <section class="panel tile-panel" id="tile-panel" hidden>
      <button type="button" class="close" id="tile-close" data-i18n-aria="tile.close">×</button>
      <h3 id="tile-name"></h3>
      <p class="tile-status" id="tile-status"></p>
      <dl id="tile-facts"></dl>
      <p class="tile-note" id="tile-note" hidden></p>
      <div class="tile-actions" id="tile-actions"></div>
      <div class="tile-structures" id="tile-structures" hidden>
        <h4 data-i18n="tile.structures"></h4>
        <ul id="structure-list"></ul>
      </div>
    </section>

    <p class="hint" id="hint" data-i18n="tile.hint"></p>

    <div class="map-controls">
      <button type="button" id="zoom-in" data-i18n-aria="zoom.in">+</button>
      <button type="button" id="zoom-out" data-i18n-aria="zoom.out">−</button>
      <button type="button" id="zoom-home" data-i18n-aria="zoom.home">◎</button>
      <button type="button" id="upgrades-toggle" class="upgrades-toggle" data-i18n-aria="panel.upgrades">⬡</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="status" id="status" role="status" hidden></div>
    <footer class="version" id="version"></footer>

    <div class="overlay" id="away" hidden>
      <div class="guest-card away-card">
        <h2 id="away-title"></h2>
        <ul id="away-list"></ul>
        <p class="muted" id="away-reduced" data-i18n="away.reduced" hidden></p>
        <button type="button" class="primary" id="away-close" data-i18n="away.close"></button>
      </div>
    </div>

    <div class="overlay" id="strain" hidden>
      <div class="guest-card strain-card">
        <h2 data-i18n="strain.title"></h2>
        <p class="muted" data-i18n="strain.subtitle"></p>
        <ul class="strain-list" id="strain-list"></ul>
        <button type="button" id="strain-later" data-i18n="strain.later"></button>
      </div>
    </div>

    <div class="overlay" id="season-end" hidden>
      <div class="guest-card season-card">
        <p class="tagline" id="season-end-week"></p>
        <h2 id="season-end-title"></h2>
        <p id="season-end-rank"></p>
        <p class="muted" id="season-end-stats"></p>
        <p class="muted" id="season-end-bonus" hidden></p>
        <p class="muted mono" id="season-end-seed"></p>
        <button type="button" class="primary" id="season-end-next" data-i18n="seasonEnd.next"></button>
      </div>
    </div>

    <div class="overlay" id="auth" hidden>
      <form class="guest-card" id="auth-form" novalidate>
        <div class="guest-brand" id="auth-brand"></div>
        <p class="tagline" data-i18n="app.tagline"></p>
        <h1 data-i18n="auth.title"></h1>
        <p class="muted" data-i18n="auth.subtitle"></p>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" id="tab-login" data-i18n="auth.loginTab"></button>
          <button type="button" role="tab" class="tab" id="tab-register" data-i18n="auth.registerTab"></button>
        </div>
        <label for="auth-name" data-i18n="auth.nameLabel"></label>
        <input id="auth-name" name="username" autocomplete="username" maxlength="20" required data-i18n-placeholder="auth.namePlaceholder" />
        <small class="muted register-only" data-i18n="auth.nameHint"></small>
        <label for="auth-password" data-i18n="auth.passwordLabel"></label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="200" required />
        <small class="muted register-only" data-i18n="auth.passwordHint"></small>
        <p class="error" id="auth-error" hidden></p>
        <button type="submit" class="primary" id="auth-submit"></button>
      </form>
    </div>

    <div class="overlay" id="password" hidden>
      <form class="guest-card" id="password-form" novalidate>
        <h2 data-i18n="password.title"></h2>
        <p class="muted" data-i18n="password.text"></p>
        <label for="new-password" data-i18n="auth.passwordLabel"></label>
        <input id="new-password" type="password" autocomplete="new-password" maxlength="200" required />
        <small class="muted" data-i18n="auth.passwordHint"></small>
        <p class="error" id="password-error" hidden></p>
        <button type="submit" class="primary" data-i18n="password.submit"></button>
        <button type="button" class="ghost" id="password-later" data-i18n="password.later"></button>
      </form>
    </div>

    <div class="overlay" id="board" hidden>
      <div class="guest-card board-card">
        <h2 data-i18n="board.title"></h2>
        <p class="muted" id="board-global"></p>
        <table id="board-table">
          <thead>
            <tr>
              <th>#</th>
              <th data-i18n="board.player"></th>
              <th data-i18n="board.biomass"></th>
              <th data-i18n="board.tiles"></th>
              <th data-i18n="board.trophies"></th>
            </tr>
          </thead>
          <tbody id="board-rows"></tbody>
        </table>
        <h3 data-i18n="history.title"></h3>
        <ul class="history" id="history"></ul>
        <button type="button" class="primary" id="board-close" data-i18n="board.close"></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
